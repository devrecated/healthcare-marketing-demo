# How Autodevelop skills may start. Edit invoke: manual | automatic.
# manual = user names the skill or /slash in this chat.
# automatic = agent may start it when the task matches.
# Missing name → that skill’s disable-model-invocation frontmatter.
# Invocation log (gitignored): .cursor/local/skill-invoke-log.yaml
#   node .cursor/skills/autodevelop/skill-invoke.mjs record <name> <manual|automatic>
#
