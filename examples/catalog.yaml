overview: >
  Reference examples for a 30-minute TypeScript + shadcn healthcare demo.
  Stack mirror: examples/healthcare (Next.js, Tailwind, shadcn/ui).
  Domain depth: examples/hospital-management-system-emr-opensource (Danphe EMR).

# Must ship in 30 minutes (aligned with healthcare + Danphe patient journey core)
required_features:
  - name: App shell
    details:
      - Dashboard layout with sidebar + main content area
      - Sidebar nav: Patients, Appointments, (optional) Doctors
      - Responsive; shadcn/ui components throughout

  - name: Patient registration & list
    details:
      - Create patient (name, email, phone, DOB, gender, address)
      - Emergency contact
      - Primary physician selection
      - Basic medical history (allergies, current meds, past history)
      - Insurance provider + policy number
      - Consent checkboxes (treatment / privacy)
      - Patients list in sidebar and/or main table (searchable)

  - name: Appointments
    details:
      - Book appointment (doctor, date/time, reason, notes)
      - Appointment statuses: pending | scheduled | cancelled
      - Admin actions: confirm/schedule and cancel (with reason)

  - name: Admin dashboard
    details:
      - Stat cards: scheduled / pending / cancelled counts
      - Data table of recent appointments (patient, doctor, status, date)
      - Status badges on rows
      - Simple admin gate (passkey or basic auth)

# Strongly recommended if time allows (from healthcare example)
recommended_features:
  - Identification document upload
  - Appointment success confirmation screen
  - SMS / notification on schedule confirm (Twilio-style stub OK)
  - Doctor roster with avatars

# Out of scope for 30 min — Danphe modules to mention only as future roadmap
roadmap_from_emr:
  - Visit / clinical encounter notes
  - OP/IP billing
  - ADT (admission, discharge, transfer)
  - Laboratory orders & results
  - Pharmacy / prescriptions
  - Radiology
  - Emergency & nursing
  - Medical records / discharge summary
  - Managerial reporting beyond appointment stats

examples:
  - name: healthcare
    description: >
      Primary UI/stack reference — Next.js, TypeScript, Tailwind, shadcn/ui, Appwrite.
      Implements patient register, book appointment, admin appointment CRUD + SMS.
      Source: https://github.com/adrianhajdin/healthcare — UI library: https://github.com/shadcn/ui
  - name: hospital-management-system-emr-opensource
    description: >
      Full HIMS/EMR domain reference (Danphe). Use for patient-journey vocabulary
      and module naming (Appointment → Visit → Clinical → Lab/Pharmacy/Radiology),
      not for cloning Angular/.NET in 30 minutes.
